<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a33"/>
      <stop offset="1" stop-color="#0a4a8c"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2bd4ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2bd4ff"/>
      <stop offset="1" stop-color="#2bd4ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <!-- terminal window -->
  <rect x="40" y="40" width="420" height="220" rx="12" fill="#07121f" stroke="#2bd4ff" stroke-opacity="0.4"/>
  <circle cx="64" cy="62" r="6" fill="#ff5f56"/><circle cx="84" cy="62" r="6" fill="#ffbd2e"/><circle cx="104" cy="62" r="6" fill="#27c93f"/>
  <g font-family="Consolas, 'Courier New', monospace" font-size="16">
    <text x="60" y="100" fill="#7fdbff">PS&gt; .\AzLabBuilder.ps1</text>
    <text x="60" y="130" fill="#c0c0c0">[1] Deploy: AMA Heartbeat lab</text>
    <text x="60" y="155" fill="#c0c0c0">[H] Health check</text>
    <text x="60" y="180" fill="#c0c0c0">[D] Open dashboard</text>
    <text x="60" y="215" fill="#27c93f">[+] Deployment succeeded.</text>
    <text x="60" y="240" fill="#ffbd2e">_</text>
  </g>
  <!-- VM grid -->
  <g>
    <rect x="520" y="70"  width="54" height="40" rx="6" fill="#1e7f4f"/><rect x="584" y="70"  width="54" height="40" rx="6" fill="#1e7f4f"/>
    <rect x="648" y="70"  width="54" height="40" rx="6" fill="#1e7f4f"/><rect x="712" y="70"  width="54" height="40" rx="6" fill="#c0392b"/>
    <rect x="776" y="70"  width="54" height="40" rx="6" fill="#1e7f4f"/>
    <rect x="520" y="120" width="54" height="40" rx="6" fill="#1e7f4f"/><rect x="584" y="120" width="54" height="40" rx="6" fill="#1e7f4f"/>
    <rect x="648" y="120" width="54" height="40" rx="6" fill="#1e7f4f"/><rect x="712" y="120" width="54" height="40" rx="6" fill="#1e7f4f"/>
    <rect x="776" y="120" width="54" height="40" rx="6" fill="#c0392b"/>
  </g>
  <!-- heartbeat line -->
  <polyline points="500,215 620,215 645,215 665,175 690,255 715,195 735,215 860,215" fill="none" stroke="url(#pulse)" stroke-width="4" stroke-linejoin="round"/>
  <!-- title -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="880" y="130" fill="#ffffff" font-size="44" font-weight="700">AzLabBuilder</text>
    <text x="882" y="165" fill="#9ecfff" font-size="18">Azure labs from a PowerShell TUI</text>
    <text x="882" y="195" fill="#9ecfff" font-size="18">AMA heartbeat &#183; health dashboard</text>
  </g>
</svg>
